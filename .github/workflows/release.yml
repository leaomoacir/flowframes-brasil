name: Publicar versão

# Ao enviar uma tag "v1.2.3", o GitHub compila o programa, gera o instalador
# e publica uma Release. O app dos usuários detecta essa Release e avisa da atualização.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Definir versão
        id: ver
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') { $v = $env:GITHUB_REF_NAME.TrimStart('v') }
          else { $v = (Get-Content version.txt -TotalCount 1).Trim() }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Garantir Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Compilar e gerar instalador
        shell: pwsh
        run: ./Build/build.ps1 -Version "${{ steps.ver.outputs.version }}"

      - name: Publicar Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Build/out/FlowFramesBrasil-Setup-${{ steps.ver.outputs.version }}.exe
          name: Flow Frames Brasil ${{ steps.ver.outputs.version }}
          body_path: changelog.txt
          generate_release_notes: false

      - name: Guardar instalador (execuções manuais)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: instalador
          path: Build/out/*.exe
